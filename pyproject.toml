
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "busbidder-spain"
version = "1.0.0"
description = "A bus booking and weighted offer-ranking application for simulated journeys in Spain."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

keywords = [
    "bus booking",
    "offer ranking",
    "travel planning",
    "weighted scoring"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Operating System :: OS Independent"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["busbidder*"]
namespaces = false
